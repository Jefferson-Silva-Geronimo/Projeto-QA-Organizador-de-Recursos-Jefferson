# Atualização de dependências (P5-05). Só Maven por enquanto: o npm entra na Fase 6, quando existir frontend/.
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # DS-06: o Cucumber está fixado na 7.23.0 porque a 7.24+ exige JUnit Platform 1.13 e o Spring Boot 3.5.16
      # gerencia a 1.12. Não subir a versão por Dependabot.
      - dependency-name: "io.cucumber:*"
      # A especificação exige Spring Boot 3.x (ADR-001). Salto de versão maior do Spring Boot e do springdoc só
      # entra por decisão da equipe, nunca por Dependabot.
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]
      # springdoc gera o contrato OpenAPI comparado com docs/api/openapi.json (CT-115, R-15): uma versão nova que
      # altere o JSON reprova a CI de propósito. Só correções (patch) entram sozinhas; o resto é decisão da equipe.
      - dependency-name: "org.springdoc:springdoc-openapi-starter-webmvc-ui"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
