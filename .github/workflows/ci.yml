# Integração contínua (Fase 3, Aula 06). Mesmo comando do terminal: ./mvnw -B verify
# Sem segredos, sem continue-on-error e sem pull_request_target.
# Ações fixadas por SHA de commit, com a versão no comentário.
name: qualidade

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qualidade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Java 21 (Temurin) com cache do Maven
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verificar (unidade, arquitetura e integração com banco real)
        run: ./mvnw -B -ntp verify

      - name: Relatórios do Surefire e do Failsafe
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relatorios-de-teste
          path: |
            target/surefire-reports
            target/failsafe-reports
          retention-days: 7
          if-no-files-found: warn
