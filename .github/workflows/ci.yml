# Integração contínua (Fase 3, Aula 06). Mesmo comando do terminal: ./mvnw -B verify
# Sem segredos, sem continue-on-error e sem pull_request_target.
# Ações fixadas por SHA de commit, com a versão no comentário.
name: qualidade

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qualidade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # o SonarCloud precisa do histórico para atribuir código novo

      - name: Java 21 (Temurin) com cache do Maven
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verificar (unidade, arquitetura e integração com banco real)
        run: ./mvnw -B -ntp verify

      - name: Relatórios do Surefire e do Failsafe
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relatorios-de-teste
          path: |
            target/surefire-reports
            target/failsafe-reports
          retention-days: 7
          if-no-files-found: warn

      - name: Relatório de cobertura do JaCoCo
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relatorio-jacoco
          path: target/site/jacoco
          retention-days: 7
          if-no-files-found: warn

      # Análise do SonarCloud. O token vem do secret SONAR_TOKEN e nunca é escrito em arquivo ou log.
      # Sem o secret (por exemplo, pull request de fork ou projeto ainda não importado), o passo avisa e segue.
      - name: Análise do SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_ORGANIZATION" ] || [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "::notice title=SonarCloud::SONAR_TOKEN, SONAR_ORGANIZATION ou SONAR_PROJECT_KEY ausente. Análise não executada."
            exit 0
          fi
          ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar -Dsonar.qualitygate.wait=true

  # Front end (Fase 6, 6.B): instalação limpa a partir do package-lock.json, contrato gerado sem divergência,
  # lint, tipos, testes de componente e build. O job e2e (6.D) é separado.
  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Node 22 com cache do npm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --ignore-scripts: scripts de instalação de pacotes não rodam na CI (SonarCloud S6505, cadeia de suprimento).
      # Verificado: lint, tipos, testes e build passam sem eles.
      - name: Instalar dependências (npm ci, sem scripts de instalação)
        run: npm ci --ignore-scripts

      - name: Tipos da API iguais ao contrato publicado (F6-01)
        run: |
          npm run gerar:api
          git diff --exit-code -- src/api/schema.d.ts

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Testes de componente e de contraste
        run: npm test

      - name: Build
        run: npm run build

  # E2E (Fase 6, 6.D): PostgreSQL, API e front reais, subidos por compose.e2e.yaml, e Playwright no Chromium, sem mocks.
  # As credenciais são fictícias e geradas nesta execução (mascaradas no log e nunca versionadas). O relatório HTML e os
  # traces sobem como artifact mesmo quando o teste falha (if: always()).
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Node 22 com cache do npm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Credenciais fictícias desta execução
        run: |
          echo "E2E_DB_NAME=e2e" >> "$GITHUB_ENV"
          echo "E2E_DB_USER=e2e" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_EMAIL=admin.e2e@exemplo.test" >> "$GITHUB_ENV"
          for variavel in E2E_DB_PASSWORD E2E_ADMIN_SENHA E2E_SOLICITANTE_SENHA E2E_RESPONSAVEL_SENHA; do
            valor=$(openssl rand -hex 16)
            echo "::add-mask::$valor"
            echo "$variavel=$valor" >> "$GITHUB_ENV"
          done

      - name: Subir PostgreSQL, API e front (compose.e2e.yaml)
        working-directory: .
        run: docker compose -f compose.e2e.yaml up --build -d

      - name: Esperar a API ficar de pé
        run: |
          for tentativa in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then
              echo "API no ar depois de $tentativa tentativas"
              exit 0
            fi
            sleep 3
          done
          echo "A API não subiu a tempo." >&2
          docker compose -f ../compose.e2e.yaml logs api >&2
          exit 1

      - name: Instalar dependências (npm ci, sem scripts de instalação)
        run: npm ci --ignore-scripts

      - name: Instalar o Chromium do Playwright
        # Binário local, na versão do package-lock.json: sem npx, que instalaria pacote sob demanda (SonarCloud S6505 e S8543).
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Testes E2E
        run: npm run e2e

      - name: Relatório do Playwright e traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relatorio-e2e
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: warn

      - name: Logs dos serviços
        if: always()
        working-directory: .
        run: docker compose -f compose.e2e.yaml logs --no-color > e2e-servicos.log 2>&1 || true

      - name: Publicar os logs dos serviços
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-e2e
          path: e2e-servicos.log
          retention-days: 7
          if-no-files-found: warn

      - name: Derrubar o ambiente
        if: always()
        working-directory: .
        run: docker compose -f compose.e2e.yaml down -v

  # Varredura de segredos no repositório e no histórico (P5-05). Usa o CLI do gitleaks, sem action de terceiros:
  # o binário vem do release oficial e o SHA-256 é conferido contra o valor fixado aqui (release v8.30.1).
  segredos:
    name: segredos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout com histórico
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Instalar gitleaks 8.30.1 com checksum conferido
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Varredura (falha se achar segredo)
        run: ./gitleaks detect --source . --no-banner --redact --verbose
