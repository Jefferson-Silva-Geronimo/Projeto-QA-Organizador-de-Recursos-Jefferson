# Atualização de dependências (P5-05). Maven na raiz e npm em frontend/ (Fase 6).
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # DS-06: o Cucumber está fixado na 7.23.0 porque a 7.24+ exige JUnit Platform 1.13 e o Spring Boot 3.5.16
      # gerencia a 1.12. Não subir a versão por Dependabot.
      - dependency-name: "io.cucumber:*"
      # A especificação exige Spring Boot 3.x (ADR-001). Salto de versão maior do Spring Boot e do springdoc só
      # entra por decisão da equipe, nunca por Dependabot.
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]
      # springdoc gera o contrato OpenAPI comparado com docs/api/openapi.json (CT-115, R-15): uma versão nova que
      # altere o JSON reprova a CI de propósito. Só correções (patch) entram sozinhas; o resto é decisão da equipe.
      - dependency-name: "org.springdoc:springdoc-openapi-starter-webmvc-ui"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Saltos maiores das bibliotecas principais só entram por decisão da equipe (ADR-015), nunca por Dependabot:
      # mudam API, contrato de tipos e regras de lint, e a suíte de componente não cobre migração.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tanstack/react-query"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@playwright/test"
        update-types: ["version-update:semver-major"]
      # TypeScript fica na 5.x: a 6 e a 7 conflitam com openapi-typescript e typescript-eslint (peer dependencies).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # ESLint fica na 9: eslint-plugin-jsx-a11y não aceita a 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # Gerador e cliente da API (F6-01): em 0.x, uma versão menor pode mudar o tipo gerado. Só correções entram sozinhas.
      - dependency-name: "openapi-typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "openapi-fetch"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
