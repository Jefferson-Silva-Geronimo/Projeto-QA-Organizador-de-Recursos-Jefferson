# Servidor estático do front end no ambiente de E2E. Rotas do React Router caem em index.html (a aplicação é SPA).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Arquivos com hash no nome podem ficar em cache; o index.html não.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-store";
  }
}
